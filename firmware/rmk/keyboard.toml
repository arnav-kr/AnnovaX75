[keyboard]
name = "AnnovaX75"
product_name = "Annova X75"
vendor_id = 0x414B
product_id = 0x4158
manufacturer = "Arnav Kumar"
chip = "rp2040"

[matrix]
row_pins = ["PIN_17", "PIN_18", "PIN_19", "PIN_20", "PIN_21", "PIN_22"]
col_pins = ["PIN_0", "PIN_1", "PIN_15", "PIN_14", "PIN_13", "PIN_12", "PIN_11", "PIN_10", "PIN_9", "PIN_8", "PIN_7", "PIN_6", "PIN_5", "PIN_4", "PIN_3"]
bootmagic = [0, 0]

[[input_device.encoder]]
pin_a = "PIN_2"
pin_b = "PIN_16"
internal_pullup = true
phase = "resolution"
resolution = 4
reverse = true
debounce_ms = 10

[host]
vial_enabled = true
rynk_enabled = false
unlock_keys = [[0, 0], [0, 1]]
insecure = false

[storage]
enabled = true
clear_storage = true

[layout]
rows = 6
cols = 15
map = """
(0,0) [0.25] (0,1) (0,2) (0,3) (0,4) [0.25] (0,5) (0,6) (0,7) (0,8) [0.25] (0,9) (0,10) (0,11) (0,12) [0.25] (0,13) [0.5] (0,14) [0.75] (e,0)
[y=0.25]
(1,0) (1,1) (1,2) (1,3) (1,4) (1,5) (1,6) (1,7) (1,8) (1,9) (1,10) (1,11) (1,12) (1,13,@2u) [0.5] (1,14)
(2,0,@1.5u) (2,1) (2,2) (2,3) (2,4) (2,5) (2,6) (2,7) (2,8) (2,9) (2,10) (2,11) (2,12) (2,13,@1.5u) [0.5] (2,14)
(3,0,@1.75u) (3,1) (3,2) (3,3) (3,4) (3,5) (3,6) (3,7) (3,8) (3,9) (3,10) (3,11) (3,12,@2.25u) [0.5] (3,14)
(4,0,@2.25u) (4,2) (4,3) (4,4) (4,5) (4,6) (4,7) (4,8) (4,9) (4,10) (4,11) (4,12,@1.75u) [1.5] (4,14)
[y=-0.75]
[14.25] (4,13)
[y=-0.25]
(5,0,@1.25u) (5,1,@1.25u) (5,2,@1.25u) (5,5,@6.25u) (5,9) (5,10) (5,11)
[y=-0.75]
[13.25] (5,12) (5,13) (5,14)
"""

[keymap]
layers = 8

[[keymap.layer]]
keys = """
Escape F1 F2 F3 F4 F5 F6 F7 F8 F9 F10 F11 F12 Delete AudioMute
Grave Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 Minus Equal Backspace Home
Tab Q W E R T Y U I O P LeftBracket RightBracket Backslash PageUp
CapsLock A S D F G H J K L Semicolon Quote Enter PageDown
LShift Z X C V B N M Comma Dot Slash RShift End Up
LCtrl LGui LAlt Space RAlt RCtrl MO(2) Left Down Right
"""
encoders = [["AudioVolUp", "AudioVolDown"]]

[[keymap.layer]]
keys = """
_ _ _ _ _ _ _ _ _ _ _ _ _ _ LShift
_ _ _ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _
"""
encoders = [["MouseWheelDown", "MouseWheelUp"]]

[[keymap.layer]]
keys = """
Bootloader _ _ _ _ _ _ _ _ _ _ _ _ _ TG(1)
_ _ _ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _ _ _
